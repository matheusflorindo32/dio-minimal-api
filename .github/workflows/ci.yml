name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Run unit tests
        run: dotnet test tests/BookStore.UnitTests --no-build --configuration Release --verbosity normal --logger "trx;LogFileName=unit-results.trx"

      - name: Run integration tests
        run: dotnet test tests/BookStore.IntegrationTests --no-build --configuration Release --verbosity normal --logger "trx;LogFileName=integration-results.trx"

      - name: Enforce NuGet vulnerability gate
        shell: bash
        run: |
          set -o pipefail
          dotnet list package --vulnerable --include-transitive | tee vulnerability-report.txt

          if grep -Eq '^[[:space:]]*>?[[:space:]].*[[:space:]](Critical|High)[[:space:]]+https?://' vulnerability-report.txt; then
            echo '::error::Critical or High NuGet vulnerability detected. Failing the security gate.'
            exit 1
          fi

          if grep -Eq '^[[:space:]]*>?[[:space:]].*[[:space:]]Moderate[[:space:]]+https?://' vulnerability-report.txt; then
            echo '::warning::Moderate NuGet vulnerabilities remain. Review and document them before release.'
          fi

          echo 'NuGet security gate passed: no Critical/High vulnerabilities detected.'

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Build Docker image
        run: docker build -t bookstore-api:ci .

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            **/TestResults/*.trx
            vulnerability-report.txt
